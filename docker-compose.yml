version: '3.8'

services:
  postgres:
    image: postgres:16-alpine
    container_name: kosmetika-db
    environment:
      POSTGRES_DB: kosmetika
      POSTGRES_USER: kosmetika
      POSTGRES_PASSWORD: kosmetika
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U kosmetika"]
      interval: 5s
      timeout: 5s
      retries: 5

  keycloak:
    image: quay.io/keycloak/keycloak:24.0
    container_name: kosmetika-keycloak
    environment:
      KC_DB: postgres
      KC_DB_URL: jdbc:postgresql://postgres:5432/kosmetika
      KC_DB_USERNAME: kosmetika
      KC_DB_PASSWORD: kosmetika
      KEYCLOAK_ADMIN: admin
      KEYCLOAK_ADMIN_PASSWORD: admin
    command: start-dev --import-realm
    ports:
      - "8080:8080"
    volumes:
      - ./keycloak:/opt/keycloak/data/import
    depends_on:
      postgres:
        condition: service_healthy

volumes:
  postgres_data:
